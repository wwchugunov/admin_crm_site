name: Platform checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: orbit_admin/package-lock.json
      - run: npm ci --prefix orbit_admin
      - run: npm run check
      - name: Validate production Compose
        env:
          ORBIT_DOMAIN: api.lomviko.com
          ORBIT_WEBSITE_DOMAIN: lomviko.com
          CH_APP_ADMIN_DOMAIN: admin.lomviko.com
          CH_SITE_ADMIN_DOMAIN: site-admin.lomviko.com
          CH_WEB_APP_DOMAIN: app.lomviko.com
        run: docker compose -f orbit_admin/deploy/compose.yaml -f orbit_admin/deploy/compose.website.yaml config --format json | node orbit_admin/deploy/preflight.cjs

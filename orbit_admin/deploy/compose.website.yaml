services:
  landing:
    image: ch-landing:1.1.1
    build:
      context: ${CH_LANDING_CONTEXT:-../../ch_landing}
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp]
    environment:
      CH_API_URL: http://orbit:4545
      CH_TRUST_PROXY: '1'
      HOST: 0.0.0.0
      PORT: '4546'
    expose: ['4546']
    stop_grace_period: 20s
    depends_on:
      orbit:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4546/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  https:
    environment:
      CH_APP_ADMIN_DOMAIN: ${CH_APP_ADMIN_DOMAIN:?Set CH_APP_ADMIN_DOMAIN in deploy/.env}
      CH_SITE_ADMIN_DOMAIN: ${CH_SITE_ADMIN_DOMAIN:?Set CH_SITE_ADMIN_DOMAIN in deploy/.env}
      ORBIT_WEBSITE_DOMAIN: ${ORBIT_WEBSITE_DOMAIN:?Set ORBIT_WEBSITE_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile.website:/etc/caddy/Caddyfile:ro,Z
    depends_on:
      landing:
        condition: service_healthy

  app-admin:
    image: orbit-admin-server:1.3.1
    pull_policy: never
    command: [node, web/server.cjs]
    restart: unless-stopped
    init: true
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ['/tmp:size=768m,mode=1777']
    environment:
      HOST: 0.0.0.0
      PORT: '4548'
      CH_PUBLIC_API_URL: https://${ORBIT_DOMAIN:?Set ORBIT_DOMAIN}
      CH_API_URL: http://orbit:4545
      CH_ADMIN_ORIGIN: https://${CH_APP_ADMIN_DOMAIN:?Set CH_APP_ADMIN_DOMAIN}
    expose: ['4548']
    depends_on: {orbit: {condition: service_healthy}}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4548/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  site-admin:
    image: ch-site-admin:0.1.0
    build:
      context: ${CH_SITE_ADMIN_CONTEXT:-../../landing_admin}
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ['/tmp:size=768m,mode=1777']
    environment:
      HOST: 0.0.0.0
      PORT: '4547'
      CH_API_URL: http://orbit:4545
      CH_ADMIN_ORIGIN: https://${CH_SITE_ADMIN_DOMAIN:?Set CH_SITE_ADMIN_DOMAIN}
    expose: ['4547']
    depends_on: {orbit: {condition: service_healthy}}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4547/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  release-init:
    image: orbit-admin-server:1.3.1
    profiles: [setup]
    user: '0:0'
    read_only: true
    network_mode: none
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    volumes: [./releases:/releases:z]
    command: [node, -e, "const fs=require('node:fs');fs.chownSync('/releases',1000,1000);fs.chmodSync('/releases',0o700)"]

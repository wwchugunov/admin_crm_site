name: orbit-admin
services:
  orbit:
    image: lomviko-platform:2.0.1
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp]
    environment:
      ORBIT_OWNER_DATA: /data
      ORBIT_OWNER_HOST: 0.0.0.0
      ORBIT_TRUST_PROXY: '1'
      PORT: '4545'
      ORBIT_RELEASES_DIR: /releases
      # Address of the product admin panel, used in administrator invitation emails.
      CH_APP_ADMIN_DOMAIN: ${CH_APP_ADMIN_DOMAIN:-}
      # Public API address for payment callbacks (monobank, LiqPay).
      CH_API_DOMAIN: ${ORBIT_DOMAIN:-}
      # Website address for company booking pages (lomviko.com/b/<address>).
      CH_WEBSITE_DOMAIN: ${ORBIT_WEBSITE_DOMAIN:-}
    volumes:
      - orbit-data:/data
      - ./releases:/releases:z
    expose: ['4545']
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4545/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  https:
    image: caddy:2
    restart: unless-stopped
    environment:
      ORBIT_DOMAIN: ${ORBIT_DOMAIN:?Set ORBIT_DOMAIN in deploy/.env}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      orbit:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  orbit-data:
  caddy-data:
  caddy-config:

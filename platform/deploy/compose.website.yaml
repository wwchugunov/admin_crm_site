services:
  landing:
    image: lomviko-landing:1.2.8
    build:
      context: ${CH_LANDING_CONTEXT:-../../website}
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp]
    environment:
      CH_API_URL: http://orbit:4545
      CH_TRUST_PROXY: '1'
      HOST: 0.0.0.0
      PORT: '4546'
    expose: ['4546']
    stop_grace_period: 20s
    depends_on:
      orbit:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4546/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  https:
    environment:
      CH_APP_ADMIN_DOMAIN: ${CH_APP_ADMIN_DOMAIN:?Set CH_APP_ADMIN_DOMAIN in deploy/.env}
      CH_SITE_ADMIN_DOMAIN: ${CH_SITE_ADMIN_DOMAIN:?Set CH_SITE_ADMIN_DOMAIN in deploy/.env}
      CH_WEB_APP_DOMAIN: ${CH_WEB_APP_DOMAIN:?Set CH_WEB_APP_DOMAIN in deploy/.env}
      ORBIT_WEBSITE_DOMAIN: ${ORBIT_WEBSITE_DOMAIN:?Set ORBIT_WEBSITE_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile.website:/etc/caddy/Caddyfile:ro,Z
    depends_on:
      landing:
        condition: service_healthy
    networks: [default, mail]

  app-admin:
    image: lomviko-platform:2.7.4
    pull_policy: never
    command: [node, web/admin-server.cjs]
    restart: unless-stopped
    init: true
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ['/tmp:size=768m,mode=1777']
    environment:
      HOST: 0.0.0.0
      PORT: '4548'
      CH_PUBLIC_API_URL: https://${ORBIT_DOMAIN:?Set ORBIT_DOMAIN}
      CH_API_URL: http://orbit:4545
      CH_ADMIN_ORIGIN: https://${CH_APP_ADMIN_DOMAIN:?Set CH_APP_ADMIN_DOMAIN}
    expose: ['4548']
    depends_on: {orbit: {condition: service_healthy}}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4548/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  # LOMVIKO in the browser: the company workspace at app.lomviko.com.
  app-web:
    image: lomviko-platform:2.7.4
    pull_policy: never
    command: [node, web/app-server.cjs]
    restart: unless-stopped
    init: true
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp]
    environment:
      HOST: 0.0.0.0
      PORT: '4549'
      CH_PUBLIC_API_URL: https://${ORBIT_DOMAIN:?Set ORBIT_DOMAIN}
      CH_API_URL: http://orbit:4545
      CH_WEB_APP_ORIGIN: https://${CH_WEB_APP_DOMAIN:?Set CH_WEB_APP_DOMAIN}
    expose: ['4549']
    depends_on: {orbit: {condition: service_healthy}}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4549/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  # The website admin runs from the platform image with its own panel profile.
  site-admin:
    image: lomviko-platform:2.7.4
    pull_policy: never
    command: [node, web/admin-server.cjs]
    restart: unless-stopped
    init: true
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ['/tmp:size=768m,mode=1777']
    environment:
      HOST: 0.0.0.0
      PORT: '4547'
      CH_ADMIN_PROFILE: website
      CH_API_URL: http://orbit:4545
      CH_PUBLIC_API_URL: https://${ORBIT_DOMAIN:?Set ORBIT_DOMAIN}
      CH_ADMIN_ORIGIN: https://${CH_SITE_ADMIN_DOMAIN:?Set CH_SITE_ADMIN_DOMAIN}
    expose: ['4547']
    depends_on: {orbit: {condition: service_healthy}}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4547/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  mail:
    name: lomviko-mail_default
    external: true

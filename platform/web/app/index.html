<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#181818" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>LOMVIKO</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="design.css" />
    <link rel="stylesheet" href="refresh.css" />
    <link rel="stylesheet" href="web.css" />
  </head>
  <body>
    <section id="auth-gate" aria-labelledby="auth-title">
      <div class="auth-card">
        <span class="wordmark">LOMVIKO</span>
        <h1 id="auth-title" data-i18n="webGateTitle">Записи, клієнти й оплати в одному місці</h1>
        <p data-i18n="webGateText">Увійдіть до своєї компанії або почніть безкоштовно до 1 березня 2027.</p>
        <div class="auth-actions">
          <button class="primary" type="button" data-action="login"><span data-i18n="m036">Увійти</span></button>
          <button class="secondary" type="button" data-action="register"><span data-i18n="registerFreeTrial">Спробувати безкоштовно</span></button>
        </div>
        <button type="button" class="help-link" data-action="support"><span data-i18n="supportNav">Допомога</span></button>
      </div>
    </section>
    <aside>
      <div class="brand" aria-label="LOMVIKO">
        <span class="wordmark">LOMVIKO</span>
      </div>
      <div class="workspace">
        <span class="workspace-icon"><span data-i18n="m691">М</span></span>
        <div>
          <strong id="business-name"
            ><span data-i18n="m536">Мій бізнес</span></strong
          ><small><span data-i18n="m692">Робочий простір</span></small>
        </div>
      </div>
      <div class="nav-label"><span data-i18n="m693">КЕРУВАННЯ</span></div>
      <nav>
        <button class="nav" data-page="dashboard">
          <span
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="3" width="7" height="7" rx="1.5" />
              <rect x="14" y="3" width="7" height="7" rx="1.5" />
              <rect x="3" y="14" width="7" height="7" rx="1.5" />
              <rect x="14" y="14" width="7" height="7" rx="1.5" /></svg></span
          ><span data-i18n="m014">Дашборд</span></button
        ><button class="nav active" data-page="schedule">
          <span
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="5" width="18" height="16" rx="3" />
              <path d="M7 3v4m10-4v4M3 10h18m-14 5h3m4 0h3" /></svg></span
          ><span data-i18n="m004">Розклад</span></button
        ><button class="nav" data-page="clients">
          <span
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="9" cy="8" r="3" />
              <path
                d="M3 21v-3a6 6 0 0 1 12 0v3m1-16a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 5"
              /></svg></span
          ><span data-i18n="m006">Клієнти</span></button
        ><button class="nav" data-page="catalog">
          <span
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="4" y="3" width="16" height="18" rx="3" />
              <path d="M8 8h8m-8 4h8m-8 4h5" /></svg></span
          ><span data-i18n="m008">Послуги та ресурси</span></button
        ><button class="nav" data-page="finance">
          <span
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 3v17h17M8 15l4-4 4 2 5-7m-5 0h5v5" /></svg></span
          ><span data-i18n="m016">Фінансовий звіт</span></button
        ><button class="nav" data-page="team">
          <span
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="9" cy="8" r="3" />
              <path
                d="M3 20v-2a6 6 0 0 1 12 0v2m2-15a3 3 0 0 1 0 6m1 4a5 5 0 0 1 3 5"
              /></svg></span
          ><span data-i18n="m018">Користувачі та ролі</span></button
        ><button class="nav" data-page="integrations">
          <span
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M9 8V3m6 5V3M6 8h12v4a6 6 0 0 1-12 0zM12 18v4"
              /></svg></span
          ><span data-i18n="m010">Інтеграції</span></button
        ><button class="nav" data-page="settings">
          <span
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 7h16M4 17h16" />
              <circle cx="9" cy="7" r="3" />
              <circle cx="15" cy="17" r="3" /></svg></span
          ><span data-i18n="m012">Налаштування та дані</span>
        </button>
      </nav>
      <div class="desktop-controls">
        <select id="business-selector" aria-label="Company" hidden></select
        ><span id="mode-pill" class="local-pill">● Local</span
        ><button id="account-entry" class="secondary">
          <span data-i18n="m036">Увійти</span>
        </button>
      </div>
      <div class="sidebar-bottom">
        <div class="offline-dot"></div>
        <strong id="storage-label"
          ><span data-i18n="m033">База на вашому пристрої</span></strong
        >
        <p id="storage-note">
          <span data-i18n="m694">Працюйте навіть без інтернету.</span
          ><br /><span data-i18n="m695">Ваші дані належать вам.</span>
        </p>
        <button type="button" class="help-link" data-action="support">
          <span data-i18n="supportNav">Допомога</span>
        </button>
        <span class="version"
          ><span data-i18n="m696">LOMVIKO · рання версія</span></span
        >
      </div>
    </aside>
    <main>
      <div class="content">
        <header class="app-toolbar">
          <div class="toolbar-title">
            <h1 id="page-title"><span data-i18n="m004">Розклад</span></h1>
            <p id="page-subtitle" class="visually-hidden"></p>
          </div>
          <div class="heading-actions">
            <button
              class="icon-button toolbar-icon"
              id="layout-toggle"
              type="button"
              aria-pressed="false"
            >
              ⋯
            </button>
            <button
              class="secondary"
              id="layout-reset"
              type="button"
              hidden
              data-i18n="layoutReset"
            >
              Скинути розташування
            </button>
            <button class="primary" id="new-booking">
              <span data-i18n="m698">＋ Новий запис</span>
            </button>
          </div>
        </header>
        <p id="layout-help" class="layout-help" hidden></p>
        <div
          id="layout-status"
          class="visually-hidden"
          role="status"
          aria-live="polite"
        ></div>
        <div
          id="connection-notice"
          class="readonly-banner"
          role="status"
          hidden
        ></div>
        <div id="view"></div>
      </div>
    </main>
    <div class="connection-corner" id="connection-corner"></div>
    <div id="toast" role="status" popover="manual" aria-live="assertive"></div>
    <dialog id="modal">
      <div class="modal-heading">
        <h2 id="modal-title"></h2>
        <button
          id="close-modal"
          class="icon-button"
          aria-label="Закрити"
          data-i18n-aria-label="m700"
        >
          ×
        </button>
      </div>
      <form id="modal-form">
        <div id="modal-fields"></div>
        <div class="modal-footer">
          <button type="button" id="cancel-modal" class="secondary">
            <span data-i18n="m168">Скасувати</span></button
          ><button class="primary" id="modal-submit" type="submit">
            <span data-i18n="m271">Зберегти</span>
          </button>
        </div>
      </form>
    </dialog>
    <script src="i18n.js"></script>
    <script src="industries.js"></script>
    <script src="industry-words.js"></script>
    <script src="web.js"></script>
    <script src="preferences.js"></script>
    <script src="date-picker.js"></script>
    <script src="staff-rules.js"></script>
    <script src="timezones.js"></script>
    <script src="analytics.js"></script>
    <script src="layout.js"></script>
    <script src="startup.js"></script>
    <script src="app.js"></script>
    <script src="views.js"></script>
    <script src="schedule-grid.js"></script>
    <script src="qr.js"></script>
    <script src="forms.js"></script>
    <script src="welcome.js"></script>
    <script src="actions.js"></script>
    <script src="finance-tools.js"></script>
    <script src="fiscal.js"></script>
    <script src="lapsed.js"></script>
    <script src="client-import.js"></script>
    <script src="schedule-free.js"></script>
    <script src="booking-page.js"></script>
    <script src="notifications.js"></script>
  </body>
</html>
